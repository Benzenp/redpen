<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redpen — Annotate the screen</title>
  <style>
    /*
     * Win 3.1 Paintbrush-inspired chrome (docs reference:
     * KakaoTalk_20260902_001940378.png) rebuilt for readability: one bevel
     * system, real 3D edges, black-on-face text everywhere, white sunken
     * fields for anything the user types into, and no floating panel that
     * covers the screenshot being reviewed.
     */
    :root {
      --face: #c0c0c0;        /* button/window face */
      --face-lt: #dfdfdf;     /* outer light edge */
      --hi: #ffffff;          /* inner light edge */
      --sh: #808080;          /* inner dark edge */
      --dsh: #000000;         /* outer dark edge */
      --field: #ffffff;       /* editable surface */
      --ink: #000000;
      --ink-soft: #404040;    /* still >= 7:1 on the face color */
      --navy: #000080;
      --desktop: #6e6e6e;     /* area around the screenshot */
      --danger: #800000;
      --ok: #006000;
      --chrome-font: "MS Sans Serif", "Microsoft Sans Serif", Tahoma, "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #008080;
      font-family: var(--chrome-font);
      font-size: 12px;
      line-height: 1.35;
      color: var(--ink);
      -webkit-font-smoothing: none;
    }
    /* User-authored text stays antialiased — Korean at 12px is unreadable
       without it, and these are content surfaces, not chrome. */
    textarea, input, select, .antialias { -webkit-font-smoothing: antialiased; }

    /* ---------- bevel system ---------- */
    .raised {
      border: 2px outset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
    }
    .sunken {
      border: 2px inset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--dsh), inset -1px -1px 0 var(--face-lt);
    }
    .etched {
      border: 1px solid var(--sh);
      box-shadow: 1px 1px 0 var(--hi) inset, -1px -1px 0 var(--hi);
    }

    /* ---------- app frame ---------- */
    #app {
      position: relative;
      height: 100%;
      padding-bottom: 26px; /* status bar rail */
      display: flex;
      flex-direction: column;
      background: var(--face);
      border: 2px outset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--hi);
    }

    #paint-titlebar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 3px;
      height: 24px;
      padding: 2px;
      background: var(--navy);
      color: #fff;
      font-weight: 700;
      user-select: none;
    }
    #paint-titlebar-text {
      flex: 1;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .titlebar-box {
      width: 20px;
      height: 18px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--face);
      color: var(--ink);
      font-size: 9px;
      line-height: 1;
      border: 2px outset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
    }
    #titlebar-sysmenu::before {
      content: '';
      width: 10px;
      height: 3px;
      background: var(--ink);
      box-shadow: 0 0 0 1px var(--face);
    }
    #titlebar-boxes { display: flex; gap: 2px; }

    /* ---------- menu bar ---------- */
    #menubar {
      flex: none;
      display: flex;
      align-items: stretch;
      height: 22px;
      padding: 0 2px;
      background: var(--face);
      box-shadow: inset 0 -1px 0 var(--sh), 0 1px 0 var(--hi);
      user-select: none;
      z-index: 40;
    }
    .menu-title {
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 9px;
      border: 0;
      background: transparent;
      font: inherit;
      color: var(--ink);
      cursor: default;
    }
    .menu-title:hover, .menu-title[aria-expanded="true"] { background: var(--navy); color: #fff; }
    .menu-spacer { flex: 1; }
    .menu-lang {
      display: flex;
      align-items: center;
      margin: 2px 2px 2px 3px;
      padding: 0 8px;
      border: 2px outset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
      background: var(--face);
      font: inherit;
      color: var(--ink);
      cursor: pointer;
    }
    .menu-lang.active {
      border-style: inset;
      box-shadow: inset 1px 1px 0 var(--dsh), inset -1px -1px 0 var(--face-lt);
      background: #fff;
      font-weight: 700;
    }
    .menu-popup {
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 214px;
      padding: 2px;
      background: var(--face);
      border: 2px outset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 3px 3px 0 rgba(0, 0, 0, 0.35);
      color: var(--ink);
      cursor: default;
      z-index: 41;
    }
    .menu-popup[hidden] { display: none; }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 24px;
      width: 100%;
      padding: 3px 10px 3px 18px;
      border: 0;
      background: transparent;
      font: inherit;
      color: var(--ink);
      text-align: left;
      cursor: default;
      position: relative;
    }
    .menu-item .accel { margin-left: auto; }
    .menu-item:hover:not([disabled]) { background: var(--navy); color: #fff; }
    .menu-item[disabled] { color: var(--sh); text-shadow: 1px 1px 0 var(--hi); }
    .menu-item.checked::before { content: '•'; position: absolute; left: 7px; font-weight: 700; }
    .menu-sep { height: 2px; margin: 3px 1px; border-top: 1px solid var(--sh); border-bottom: 1px solid var(--hi); }

    /* ---------- workspace ---------- */
    #workspace { flex: 1; display: flex; min-height: 0; }

    #toolbox {
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 3px 2px;
      background: var(--face);
    }
    #toolbar {
      display: grid;
      grid-template-columns: repeat(2, 30px);
      gap: 2px;
      padding: 3px;
      border: 2px outset var(--face-lt);
      border-radius: 0;
      box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
      background: var(--face);
    }
    #toolbar button {
      width: 30px;
      height: 30px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--face);
      color: var(--ink);
      border: 2px outset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
      border-radius: 0;
      cursor: pointer;
    }
    #toolbar button svg { width: 18px; height: 18px; }
    #toolbar button:active,
    #toolbar button.active {
      border-style: inset;
      box-shadow: inset 1px 1px 0 var(--dsh), inset -1px -1px 0 var(--face-lt);
      background: #fff;
      color: var(--navy);
    }
    #toolbar button.active { outline: 1px dotted var(--ink); outline-offset: -5px; }
    #toolbar button:disabled { color: var(--sh); cursor: default; }
    #toolbar .divider {
      grid-column: 1 / -1;
      height: 2px;
      margin: 2px 0;
      border-top: 1px solid var(--sh);
      border-bottom: 1px solid var(--hi);
    }
    #toolbox-hint {
      width: 68px;
      padding: 2px 0;
      text-align: center;
      color: var(--ink-soft);
      font-size: 10px;
      line-height: 1.15;
      word-break: keep-all;
    }

    #canvas-area {
      position: relative;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      background: var(--desktop);
      border: 2px inset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--dsh);
    }
    #screenshot-source { display: none; }
    canvas { display: block; touch-action: none; }
    canvas.tool-pen, canvas.tool-arrow, canvas.tool-line, canvas.tool-rectangle, canvas.tool-ellipse, canvas.tool-mask { cursor: crosshair; }
    canvas.tool-text { cursor: text; }
    canvas.tool-erase { cursor: cell; }
    canvas.tool-select { cursor: default; }

    #mask-opacity-control {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 7;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      background: var(--face);
      border: 2px outset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 2px 2px 0 rgba(0, 0, 0, 0.3);
      color: var(--ink);
    }
    #mask-opacity-control[hidden] { display: none; }
    #mask-opacity {
      width: 110px;
      height: 18px;
      margin: 0;
      accent-color: var(--navy);
      cursor: pointer;
    }
    #mask-opacity:disabled { cursor: default; }
    #mask-opacity-preview {
      position: relative;
      width: 30px;
      height: 18px;
      flex: none;
      overflow: hidden;
      border: 2px inset var(--face-lt);
      background:
        linear-gradient(45deg, #b0b0b0 25%, transparent 25%, transparent 75%, #b0b0b0 75%),
        linear-gradient(45deg, #b0b0b0 25%, #fff 25%, #fff 75%, #b0b0b0 75%);
      background-position: 0 0, 4px 4px;
      background-size: 8px 8px;
    }
    #mask-opacity-preview::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--navy);
      opacity: var(--mask-opacity, 0.5);
    }
    #mask-opacity-value {
      width: 38px;
      padding: 1px 3px;
      background: var(--field);
      border: 2px inset var(--face-lt);
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    #canvas-empty-hint {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      max-width: 80%;
      padding: 6px 12px;
      background: #ffffe1;
      color: var(--ink);
      border: 1px solid var(--ink);
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }
    .canvas-text-editor {
      position: absolute;
      z-index: 8;
      resize: none;
      overflow: hidden;
      padding: 2px;
      border: 1px dashed var(--ink);
      background: rgba(255, 255, 255, 0.94);
      font-family: var(--chrome-font);
      line-height: 1.25;
      outline: none;
    }

    /* ---------- sidebar ---------- */
    #sidebar {
      flex: none;
      width: 322px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--face);
      border-left: 2px solid var(--hi);
      box-shadow: -3px 0 0 -1px var(--sh);
    }
    #sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px; }

    .panel {
      margin: 0 0 10px;
      padding: 8px 8px 10px;
      border: 2px groove var(--face-lt);
      min-width: 0;
    }
    .panel > legend {
      padding: 0 4px;
      font-weight: 700;
      color: var(--ink);
    }

    .win-button {
      padding: 4px 10px;
      background: var(--face);
      color: var(--ink);
      border: 2px outset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
      border-radius: 0;
      font: inherit;
      cursor: pointer;
    }
    .win-button:active:not(:disabled) {
      border-style: inset;
      box-shadow: inset 1px 1px 0 var(--dsh), inset -1px -1px 0 var(--face-lt);
    }
    .win-button:disabled { color: var(--sh); text-shadow: 1px 1px 0 var(--hi); cursor: default; }
    .win-button.default { margin: 2px; box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 0 0 0 2px var(--dsh); }

    #new-instruction { width: 100%; font-weight: 700; }

    .group-card {
      margin-bottom: 7px;
      background: var(--face);
      border: 2px outset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
      cursor: pointer;
    }
    .group-card .head {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 20px;
      padding: 0 3px;
      background: var(--sh);
      color: #fff;
      font-weight: 700;
    }
    .group-card.active .head { background: var(--navy); }
    .group-card.active { outline: 2px solid var(--navy); outline-offset: -2px; }
    .group-card .dot {
      width: 11px;
      height: 11px;
      flex: none;
      border: 1px solid var(--ink);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.7);
    }
    .group-card .number { font-size: 12px; }
    .group-card .count { margin-left: auto; font-weight: 400; }
    .group-card .head button {
      width: 17px;
      height: 15px;
      flex: none;
      padding: 0;
      line-height: 11px;
      font-size: 11px;
      background: var(--face);
      color: var(--ink);
      border: 2px outset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
      cursor: pointer;
    }
    .group-card .body { padding: 6px; }
    .group-card textarea {
      display: block;
      width: 100%;
      min-height: 44px;
      resize: vertical;
      padding: 3px 4px;
      background: var(--field);
      color: var(--ink);
      border: 2px inset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--dsh);
      border-radius: 0;
      font-family: var(--chrome-font);
      font-size: 12px;
    }
    textarea::placeholder { color: var(--sh); }
    .group-card .empty-warning {
      margin-top: 5px;
      color: var(--danger);
    }
    .reference-zone {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 56px;
      margin-top: 6px;
      padding: 5px;
      background: var(--field);
      border: 2px inset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--dsh);
      color: var(--ink-soft);
    }
    .reference-zone.drag-over { background: #e6e6ff; outline: 2px dotted var(--navy); outline-offset: -4px; }
    .reference-zone .reference-empty { flex: 1; text-align: center; color: var(--sh); }
    .reference-thumb { position: relative; width: 54px; height: 44px; flex: 0 0 auto; }
    .reference-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; border: 1px solid var(--sh); }
    .reference-thumb button {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 16px;
      height: 16px;
      padding: 0;
      line-height: 10px;
      background: var(--face);
      color: var(--ink);
      border: 2px outset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
      cursor: pointer;
    }
    .reference-zone .reference-capacity { margin-left: auto; align-self: flex-end; color: var(--ink); }

    #selection-group-control {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      padding: 5px 6px;
      background: var(--face);
      border: 2px groove var(--face-lt);
    }
    #selection-group-control[hidden] { display: none; }
    #selection-group {
      margin-left: auto;
      padding: 2px;
      background: var(--field);
      color: var(--ink);
      border: 2px inset var(--face-lt);
      border-radius: 0;
      font: inherit;
    }

    #global-note {
      display: block;
      width: 100%;
      min-height: 56px;
      resize: vertical;
      padding: 4px;
      background: var(--field);
      color: var(--ink);
      border: 2px inset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--dsh);
      border-radius: 0;
      font-family: var(--chrome-font);
      font-size: 12px;
    }

    #sidebar-footer {
      flex: none;
      padding: 8px;
      box-shadow: inset 0 2px 0 -1px var(--sh), inset 0 3px 0 -1px var(--hi);
    }
    #submit-button { width: calc(100% - 4px); padding: 7px; font-weight: 700; }
    #submit-status {
      margin-top: 6px;
      min-height: 16px;
      color: var(--ink-soft);
      word-break: break-word;
    }
    #submit-status.success { color: var(--ok); font-weight: 700; }
    #submit-status.error { color: var(--danger); font-weight: 700; }

    /* ---------- status bar ---------- */
    #paint-statusbar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 26px;
      z-index: 7;
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto auto;
      align-items: stretch;
      gap: 3px;
      padding: 2px;
      background: var(--face);
      box-shadow: inset 0 2px 0 -1px var(--sh), inset 0 3px 0 -1px var(--hi);
    }
    #interaction-status, #zoom-indicator {
      display: flex;
      align-items: center;
      padding: 0 6px;
      background: var(--face);
      color: var(--ink);
      border: 2px inset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--sh);
      border-radius: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #zoom-indicator { justify-content: center; min-width: 62px; cursor: pointer; }
    #retro-palette {
      display: grid;
      grid-auto-flow: column;
      align-items: center;
      gap: 2px;
      padding: 2px 4px;
      border: 2px inset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--sh);
    }
    #retro-palette button {
      width: 16px;
      height: 16px;
      padding: 0;
      border: 1px solid var(--ink);
      cursor: pointer;
    }
    #retro-palette button.active { outline: 2px solid var(--ink); outline-offset: 1px; }

    /* ---------- dialogs ---------- */
    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
    }
    .dialog-backdrop[hidden] { display: none; }
    .dialog {
      min-width: 340px;
      max-width: 460px;
      padding: 2px;
      background: var(--face);
      border: 2px outset var(--face-lt);
      box-shadow: inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 4px 4px 0 rgba(0, 0, 0, 0.4);
    }
    .dialog-title {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 22px;
      padding: 2px;
      background: var(--navy);
      color: #fff;
      font-weight: 700;
    }
    .dialog-title span { flex: 1; text-align: center; }
    .dialog-body { padding: 12px 14px; }
    .dialog-footer { display: flex; justify-content: center; padding: 0 12px 12px; }
    #shortcuts-table { width: 100%; border-collapse: collapse; }
    #shortcuts-table th {
      padding: 8px 0 3px;
      text-align: left;
      font-weight: 700;
      border-bottom: 1px solid var(--sh);
      box-shadow: 0 1px 0 var(--hi);
    }
    #shortcuts-table td { padding: 2px 0; vertical-align: top; }
    #shortcuts-table td.key {
      width: 130px;
      padding-right: 10px;
      font-weight: 700;
      white-space: nowrap;
    }
    #submit-overlay .dialog { text-align: center; }
    #submit-overlay .checkmark {
      width: 44px;
      height: 44px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ok);
      border: 2px outset #7fbf7f;
    }
    #submit-overlay .checkmark svg { width: 26px; height: 26px; }
    #submit-overlay .headline { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    #submit-overlay .taskid {
      display: block;
      margin: 0 auto 10px;
      padding: 4px 6px;
      background: var(--field);
      border: 2px inset var(--face-lt);
      font-family: "Courier New", monospace;
      word-break: break-all;
    }
    #submit-overlay .sub { color: var(--ink); }
  </style>
</head>
<body>
  <div id="app">
    <div id="paint-titlebar">
      <span class="titlebar-box" id="titlebar-sysmenu" aria-hidden="true"></span>
      <span id="paint-titlebar-text">Redpen - Screen annotation</span>
      <span id="titlebar-boxes" aria-hidden="true">
        <span class="titlebar-box">▼</span><span class="titlebar-box">▲</span>
      </span>
    </div>

    <div id="menubar" role="menubar">
      <div class="menu-title" role="menuitem" tabindex="0" data-menu="file" aria-expanded="false">File</div>
      <div class="menu-title" role="menuitem" tabindex="0" data-menu="edit" aria-expanded="false">Edit</div>
      <div class="menu-title" role="menuitem" tabindex="0" data-menu="view" aria-expanded="false">View</div>
      <div class="menu-title" role="menuitem" tabindex="0" data-menu="help" aria-expanded="false">Help</div>
      <span class="menu-spacer"></span>
      <button type="button" class="menu-lang active" data-locale="en">English</button>
      <button type="button" class="menu-lang" data-locale="ko">한국어</button>
    </div>

    <div id="workspace">
      <div id="toolbox">
        <div id="toolbar">
          <button data-tool="select" title="Select / Move (V)" aria-label="Select or move marks">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="m5 3 14 8-7 2-3 7z"/></svg>
          </button>
          <button data-tool="pen" title="Pen (P)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button data-tool="arrow" title="Arrow (A)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 19 5"/><path d="M9 5h10v10"/></svg>
          </button>
          <button data-tool="line" title="Line (L)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19 19 5"/></svg>
          </button>
          <button data-tool="rectangle" title="Rectangle (R)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14"/></svg>
          </button>
          <button data-tool="ellipse" title="Ellipse (O)">

        referenceEmpty: '이미지를 붙여넣거나 여기에 드롭',

        maskOpacity: '마스크 투명도',
        uploadFailed: (count) => `${count}개 이미지를 첨부하지 못했습니다.`,
        attachedLimit: '최대 3장까지만 첨부했습니다.',
        emptyWarning: '아직 아무것도 그리지 않았어요',
        canvasHint: '화면에서 수정할 부분을 표시하세요.',
        fitToWindow: '창에 맞추기',
        groupSwatch: (number) => `그룹 #${number}`,
        tools: {

          pen: '펜 (P)', arrow: '화살표 (A)', line: '직선 (L)', rectangle: '사각형 (R)',
          ellipse: '원 (O)', text: '텍스트 영역 (T)', mask: '가리기 (M)',

        },
        toolNames: {
          select: '선택 / 이동', pen: '펜', arrow: '화살표', line: '직선', rectangle: '사각형',
          ellipse: '원', text: '텍스트 영역', mask: '가리기', erase: '지우개',
        },
        undo: '되돌리기 (Ctrl+Z)',
        redo: '다시 실행 (Ctrl+Shift+Z)',
        menus: {
          file: '파일', edit: '편집', view: '보기', help: '도움말',
          newInstruction: '새 지시', submit: '지시 제출',
          undo: '되돌리기', redo: '다시 실행', deleteSelection: '선택 삭제',
          zoomIn: '확대', zoomOut: '축소', fit: '창에 맞추기',
          shortcuts: '단축키...',
        },
        shortcutsTitle: '단축키',
        shortcutSections: [
          ['도구', [
            ['V', '선택 / 이동'], ['P', '펜'], ['A', '화살표'], ['L', '직선'],
            ['R', '사각형'], ['O', '원'], ['T', '텍스트 영역'], ['M', '가리기'], ['E', '지우개'],
          ]],
          ['그리기', [
            ['Shift + 드래그', '정사각형 / 정원 / 45° 고정'],
            ['빈 곳 드래그', '영역 선택 후 드래그하면 그 부분을 다른 위치로 복사'],
            ['더블클릭 / Enter', '기존 텍스트 수정'],
            ['Ctrl + Enter', '입력 중인 텍스트 확정'],
            ['Delete', '선택한 표시 삭제'],
            ['Esc', '선택 해제 / 그리기 취소'],
          ]],
          ['그룹', [
            ['1 - 9', '활성 지시 그룹 전환'],
            ['N', '새 지시 그룹'],
          ]],
          ['보기', [
            ['마우스 휠', '포인터 기준 확대/축소'],
            ['+ / -', '확대 / 축소'],
            ['0', '창에 맞추기'],
            ['Space + 드래그', '화면 이동'],
          ]],
          ['편집', [
            ['Ctrl + Z', '되돌리기'], ['Ctrl + Shift + Z', '다시 실행'],
          ]],
        ],
        ok: '확인',
      },
    };
    let locale = localStorage.getItem('redpen-locale') === 'ko' ? 'ko' : 'en';
    const tr = (key) => COPY[locale][key];
    const el = (id) => document.getElementById(id);

    const canvas = el('annotation-canvas');
    const img = el('screenshot-source');
    img.src = `/api/sessions/${sessionId}/annotator/screenshot?token=${encodeURIComponent(token)}`;

    let app;
    let currentTool = 'select';
    let lastRenderedActiveGroupId = null;
    let lastRenderedGlobalNote = null;

    // ---------- menu bar ----------
    // The menu is the discoverability surface: every shortcut the canvas
    // supports is reachable (and labelled) here, so nothing is hidden behind
    // a keypress the user has to already know about.
    const MENUS = {
      file: () => [
        { label: tr('menus').newInstruction, accel: 'N', enabled: !el('new-instruction').disabled, run: () => el('new-instruction').click() },
        { separator: true },
        { label: tr('menus').submit, accel: 'Ctrl+Enter', enabled: !el('submit-button').disabled, run: () => el('submit-button').click() },
      ],
      edit: () => [
        { label: tr('menus').undo, accel: 'Ctrl+Z', enabled: !el('undo-button').disabled, run: () => app.undo() },
        { label: tr('menus').redo, accel: 'Ctrl+Shift+Z', enabled: !el('redo-button').disabled, run: () => app.redo() },
        { separator: true },
        { label: tr('menus').deleteSelection, accel: 'Del', enabled: Boolean(app?.hasSelection?.()), run: () => app.deleteSelection() },
      ],
      view: () => [
        { label: tr('menus').zoomIn, accel: '+', enabled: true, run: () => app.zoomBy(1.25) },
        { label: tr('menus').zoomOut, accel: '-', enabled: true, run: () => app.zoomBy(0.8) },
        { separator: true },
        { label: tr('menus').fit, accel: '0', enabled: true, run: () => app.fitToView() },
      ],
      help: () => [
        { label: tr('menus').shortcuts, accel: 'F1', enabled: true, run: () => openShortcuts() },
      ],
    };

    function closeMenus() {
      for (const title of document.querySelectorAll('.menu-title')) {
        title.setAttribute('aria-expanded', 'false');
        title.querySelector('.menu-popup')?.remove();
      }
    }

    function openMenu(title) {
      const wasOpen = title.getAttribute('aria-expanded') === 'true';
      closeMenus();
      if (wasOpen) return;
      const popup = document.createElement('div');
      popup.className = 'menu-popup';
      for (const item of MENUS[title.dataset.menu]()) {
        if (item.separator) {
          const separator = document.createElement('div');
          separator.className = 'menu-sep';
          popup.appendChild(separator);
          continue;
        }
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'menu-item' + (item.checked ? ' checked' : '');
        button.disabled = !item.enabled;
        const label = document.createElement('span');
        label.textContent = item.label;
        button.appendChild(label);
        if (item.accel) {
          const accel = document.createElement('span');
          accel.className = 'accel';
          accel.textContent = item.accel;
          button.appendChild(accel);
        }
        button.addEventListener('click', (event) => {
          event.stopPropagation();
          closeMenus();
          item.run();
        });
        popup.appendChild(button);
      }
      title.appendChild(popup);
      title.setAttribute('aria-expanded', 'true');
    }

    for (const title of document.querySelectorAll('.menu-title')) {
      title.addEventListener('click', (event) => {
        event.stopPropagation();
        openMenu(title);
      });
      title.addEventListener('pointerenter', () => {
        if (document.querySelector('.menu-title[aria-expanded="true"]')) openMenu(title);
      });
    }
    document.addEventListener('click', closeMenus);

    // ---------- shortcut dialog ----------
    function openShortcuts() {
      const table = el('shortcuts-table');
      table.innerHTML = '';
      for (const [section, rows] of tr('shortcutSections')) {
        const head = document.createElement('tr');
        const heading = document.createElement('th');
        heading.colSpan = 2;
        heading.textContent = section;
        head.appendChild(heading);
        table.appendChild(head);
        for (const [key, description] of rows) {
          const row = document.createElement('tr');
          const keyCell = document.createElement('td');
          keyCell.className = 'key';
          keyCell.textContent = key;
          const descriptionCell = document.createElement('td');
          descriptionCell.textContent = description;
          row.append(keyCell, descriptionCell);
          table.appendChild(row);
        }
      }
      el('shortcuts-dialog').hidden = false;
      el('shortcuts-ok').focus();
    }
    const closeShortcuts = () => { el('shortcuts-dialog').hidden = true; };
    el('shortcuts-ok').addEventListener('click', closeShortcuts);
    el('shortcuts-close').addEventListener('click', closeShortcuts);
    el('shortcuts-dialog').addEventListener('click', (event) => {
      if (event.target === el('shortcuts-dialog')) closeShortcuts();
    });

    function applyLocale() {
      closeMenus();
      document.documentElement.lang = locale;
      document.title = tr('title');
      el('paint-titlebar-text').textContent = tr('windowTitle');
      el('groups-label').textContent = tr('groups');
      el('new-instruction').textContent = tr('newInstruction');
      el('global-note-label').textContent = tr('globalNote');
      el('global-note').placeholder = tr('globalPlaceholder');
      el('submit-button').textContent = tr('submit');
      el('submit-overlay-headline').textContent = tr('submitted');
      el('submit-overlay-sub').textContent = tr('submittedSub');
      el('selection-group-control-text').textContent = tr('moveSelection');
      el('canvas-empty-hint').textContent = tr('canvasHint');
      el('mask-opacity-label').textContent = tr('maskOpacity');
      el('undo-button').title = tr('undo');
      el('redo-button').title = tr('redo');
      el('zoom-indicator').title = tr('fitToWindow');
      el('shortcuts-title').textContent = tr('shortcutsTitle');
      el('shortcuts-ok').textContent = tr('ok');
      el('toolbox-hint').textContent = tr('toolNames')[currentTool];
      for (const title of document.querySelectorAll('.menu-title')) {
        title.textContent = tr('menus')[title.dataset.menu];
      }
      for (const button of document.querySelectorAll('[data-locale]')) {
        button.classList.toggle('active', button.dataset.locale === locale);
      }
      for (const button of document.querySelectorAll('#toolbar [data-tool]')) {
        button.title = COPY[locale].tools[button.dataset.tool];
      }
      if (!el('shortcuts-dialog').hidden) openShortcuts();
      app?.setLocale(locale);
      if (app?.state) renderSidebar();
    }

    const TOOL_KEYS = { v: 'select', p: 'pen', a: 'arrow', l: 'line', r: 'rectangle', o: 'ellipse', t: 'text', m: 'mask', e: 'erase' };

    function resizeCanvas() {
      const area = el('canvas-area');
      canvas.width = area.clientWidth;
      canvas.height = area.clientHeight;
      if (app) app.render();
    }

    function selectTool(tool) {
      app.setTool(tool);
      // setTool() refuses while a save is in flight; don't paint a tool as
      // active when the canvas is still on the previous one.
      if (app.tool !== tool) return;
      currentTool = tool;
      canvas.className = `tool-${tool}`;
      for (const b of document.querySelectorAll('#toolbar button[data-tool]')) {
        b.classList.toggle('active', b.dataset.tool === tool);
      }
      el('toolbox-hint').textContent = tr('toolNames')[tool];
      el('mask-opacity-control').hidden = tool !== 'mask';
    }

    function updateZoomIndicator() {
      el('zoom-indicator').textContent = `${Math.round(app.scale * 100)}%`;
    }

    function updateMaskOpacityControl(opacity) {
      const normalized = Math.max(0.1, Math.min(1, Number(opacity) || 0.5));
      el('mask-opacity').value = String(normalized);
      el('mask-opacity-value').textContent = `${Math.round(normalized * 100)}%`;
      el('mask-opacity-preview').style.setProperty('--mask-opacity', String(normalized));
    }

    async function boot() {
      app = new window.RedpenSession.SessionAnnotatorApp({ canvas, screenshotImage: img, sessionId, token, locale });
      const baseRender = app.render.bind(app);
      app.render = () => {
        baseRender();
        updateZoomIndicator();
        updateMaskOpacityControl(app.getDisplayedMaskOpacity());
      };
      app.onStateChange = renderSidebar;
      resizeCanvas();
      await app.load();
      renderSidebar();
      updateZoomIndicator();

      el('new-instruction').addEventListener('click', async () => {
        await app.createGroup();
        renderSidebar();
      });
      el('undo-button').addEventListener('click', () => app.undo());
      el('redo-button').addEventListener('click', () => app.redo());
      el('zoom-indicator').addEventListener('click', () => app.fitToView());
      for (const button of document.querySelectorAll('[data-locale]')) {
        button.addEventListener('click', () => {
          locale = button.dataset.locale;
          localStorage.setItem('redpen-locale', locale);
          applyLocale();
        });
      }
      el('submit-button').addEventListener('click', async () => {
        const status = el('submit-status');
        status.className = '';
        try {
          const globalNoteValue = el('global-note').value;
          await app.setGlobalNote(globalNoteValue);
          const result = await app.submit();
          status.textContent = result.cleanupWarnings?.length
            ? `${tr('submittingDone')} — ${result.taskId} (${tr('cleanupWarning')}: ${result.cleanupWarnings.length})`
            : `${tr('submittingDone')} — ${result.taskId}`;
          status.className = result.cleanupWarnings?.length ? 'error' : 'success';
          showSubmitOverlayAndClose(result.taskId);
        } catch (err) {
          status.textContent = `${tr('error')}: ${err.message}`;
          status.className = 'error';
        }
      });

      for (const button of document.querySelectorAll('#toolbar button[data-tool]')) {
        button.addEventListener('click', () => selectTool(button.dataset.tool));
      }
      el('mask-opacity').addEventListener('input', (event) => {
        const opacity = Number(event.target.value);
        updateMaskOpacityControl(opacity);
        app.previewMaskOpacity(opacity);
      });
      el('mask-opacity').addEventListener('change', () => {
        void app.commitMaskOpacity();
      });
      selectTool('select');

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          closeMenus();
          closeShortcuts();
        }
        if (event.key === 'F1') { event.preventDefault(); openShortcuts(); return; }
        if (document.activeElement && ['TEXTAREA', 'INPUT'].includes(document.activeElement.tagName)) return;
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
          event.preventDefault();
          if (!el('submit-button').disabled) el('submit-button').click();
          return;
        }
        if (event.ctrlKey || event.metaKey) return; // undo/redo are handled inside SessionAnnotatorApp
        const tool = TOOL_KEYS[event.key.toLowerCase()];
        if (tool) { selectTool(tool); return; }
        if (event.key.toLowerCase() === 'n') { if (!el('new-instruction').disabled) el('new-instruction').click(); return; }
        if (event.key === '+' || event.key === '=') { app.zoomBy(1.25); return; }
        if (event.key === '-' || event.key === '_') { app.zoomBy(0.8); return; }
        if (event.key === '0') { app.fitToView(); return; }
      });

      window.__redpenSessionApp = app;
      window.__redpenRenderSidebar = renderSidebar;
      applyLocale();
    }

    function renderPalette(state) {
      const palette = el('retro-palette');
      palette.innerHTML = '';
      for (const group of state.groups) {
        const swatch = document.createElement('button');
        swatch.type = 'button';
        swatch.style.background = group.color;
        swatch.title = tr('groupSwatch')(group.number);
        swatch.className = group.id === state.activeGroupId ? 'active' : '';
        swatch.addEventListener('click', async () => {
          await app.focusGroup(group.id);
          renderSidebar();
        });
        swatch.addEventListener('pointerenter', () => app.setHoveredGroup(group.id));
        swatch.addEventListener('pointerleave', () => app.setHoveredGroup(null));
        palette.appendChild(swatch);
      }
    }

    // renderSidebar() rebuilds every card from scratch, which used to throw
    // away the caret (and any not-yet-saved keystrokes) of whatever note the
    // user was typing whenever an unrelated round-trip finished.
    function captureNoteFocus() {
      const active = document.activeElement;
      if (!(active instanceof HTMLTextAreaElement)) return null;
      const card = active.closest('.group-card');
      if (!card) return null;
      return { groupId: card.dataset.groupId, value: active.value, start: active.selectionStart, end: active.selectionEnd };
    }

    function restoreNoteFocus(snapshot) {
      if (!snapshot) return;
      const textarea = document.querySelector(`.group-card[data-group-id="${CSS.escape(snapshot.groupId)}"] textarea`);
      if (!textarea) return;
      textarea.value = snapshot.value;
      textarea.focus();
      textarea.setSelectionRange(snapshot.start, snapshot.end);
    }

    function renderSidebar() {
      const state = app.state;
      const mutationPending = app.isMutationInFlight();
      const noteFocus = captureNoteFocus();
      el('canvas-empty-hint').hidden = state.marks.length > 0;
      for (const button of document.querySelectorAll('#toolbar button[data-tool]')) button.disabled = mutationPending;
      el('mask-opacity').disabled = mutationPending;
      el('new-instruction').disabled = mutationPending;
      el('global-note').disabled = mutationPending;
      renderPalette(state);
      const selectionGroup = el('selection-group');
      selectionGroup.innerHTML = '';
      for (const group of state.groups) {
        const option = document.createElement('option');
        option.value = group.id;
        option.textContent = `#${group.number}`;
        option.selected = group.id === state.activeGroupId;
        selectionGroup.appendChild(option);
      }
      const hasSelection = Boolean(app.selectedMarkIds?.size);
      el('selection-group-control').hidden = !hasSelection;
      selectionGroup.disabled = mutationPending || !hasSelection;
      selectionGroup.onchange = () => app.reassignSelection(selectionGroup.value);
      const container = el('group-cards');
      container.innerHTML = '';
      for (const group of state.groups) {
        const card = document.createElement('div');
        card.className = 'group-card' + (group.id === state.activeGroupId ? ' active' : '');
        card.dataset.groupId = group.id;
        card.setAttribute('aria-disabled', String(mutationPending));

        const head = document.createElement('div');
        head.className = 'head';

        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.style.background = group.color;
        head.appendChild(dot);

        const number = document.createElement('span');
        number.className = 'number';
        number.textContent = `#${group.number}`;
        head.appendChild(number);

        const count = document.createElement('span');
        count.className = 'count';
        count.textContent = tr('marks')(group.markIds.length);
        head.appendChild(count);

        card.appendChild(head);

        const body = document.createElement('div');
        body.className = 'body';
        card.appendChild(body);

        const textarea = document.createElement('textarea');
        textarea.placeholder = tr('groupPlaceholder');
        textarea.value = group.note ?? '';
        textarea.disabled = mutationPending;
        // Typing a note targets its group without yanking the canvas around
        // the way a full focusGroup() pan would mid-sentence.
        textarea.addEventListener('click', (event) => {
          event.stopPropagation();
          if (group.id !== state.activeGroupId) void app.setActiveGroup(group.id);
        });
        textarea.addEventListener('change', async () => {
          await app.setGroupNote(group.id, textarea.value);
        });
        body.appendChild(textarea);

        const referenceZone = document.createElement('div');
        referenceZone.className = 'reference-zone';
        // Ctrl+V attaches to the *active* group, so clicking a zone has to
        // make its group active or the paste lands on the wrong card.
        referenceZone.addEventListener('click', (event) => {
          event.stopPropagation();
          if (group.id !== state.activeGroupId) void app.setActiveGroup(group.id);
        });
        const referenceIds = group.referenceIds;
        if (referenceIds.length === 0) {
          const empty = document.createElement('span');
          empty.className = 'reference-empty';
          empty.textContent = tr('referenceEmpty');
          referenceZone.appendChild(empty);
        }
        for (const referenceId of referenceIds) {
          const thumb = document.createElement('div');
          thumb.className = 'reference-thumb';
          const image = document.createElement('img');
          image.alt = tr('referenceAlt');
          app.getReferenceImageBlob(referenceId).then((blob) => {
            if (!image.isConnected) return;
            const url = URL.createObjectURL(blob);
            image.src = url;
            image.addEventListener('load', () => URL.revokeObjectURL(url), { once: true });
          }).catch(() => {});
          thumb.appendChild(image);
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.title = tr('removeReference');
          remove.textContent = '×';
          remove.disabled = mutationPending;
          remove.addEventListener('click', async (event) => {
            event.stopPropagation();
            await app.removeGroupReference(group.id, referenceId);
          });
          thumb.appendChild(remove);
          referenceZone.appendChild(thumb);
        }
        const capacity = document.createElement('span');
        capacity.className = 'reference-capacity';
        capacity.textContent = `${referenceIds.length}/3`;
        referenceZone.appendChild(capacity);
        body.appendChild(referenceZone);

        const attachDroppedImage = async (event) => {
          event.preventDefault();
          event.stopPropagation();
          referenceZone.classList.remove('drag-over');
          const files = Array.from(event.dataTransfer.files).filter((candidate) => candidate.type.startsWith('image/'));
          if (files.length === 0) return;
          const availableSlots = 3 - referenceIds.length;
          if (availableSlots <= 0) {
            el('submit-status').textContent = tr('referenceLimit');
            el('submit-status').className = 'error';
            return;
          }
          let failedUploads = 0;
          for (const file of files.slice(0, availableSlots)) {
            try {
              await app.addGroupReference(group.id, file);
            } catch {
              failedUploads++;
            }
          }
          if (files.length > availableSlots || failedUploads > 0) {
            el('submit-status').textContent =
              failedUploads > 0
                ? tr('uploadFailed')(failedUploads)
                : tr('attachedLimit');
            el('submit-status').className = 'error';
          }
        };
        card.addEventListener('dragover', (event) => {
          event.preventDefault();
          event.stopPropagation();
          referenceZone.classList.add('drag-over');
        });
        card.addEventListener('dragleave', (event) => {
          if (!card.contains(event.relatedTarget)) referenceZone.classList.remove('drag-over');
        });
        card.addEventListener('drop', attachDroppedImage);
        card.addEventListener('pointerenter', () => app.setHoveredGroup(group.id));
        card.addEventListener('pointerleave', () => app.setHoveredGroup(null));

        if (group.markIds.length === 0) {
          const warning = document.createElement('div');
          warning.className = 'empty-warning';
          warning.textContent = tr('emptyWarning');
          body.appendChild(warning);
          if (state.groups.length > 1 && group.referenceIds.length === 0) {
            const removeGroup = document.createElement('button');
            removeGroup.type = 'button';
            removeGroup.textContent = '×';
            removeGroup.title = tr('deleteGroup');
            removeGroup.disabled = mutationPending;
            removeGroup.addEventListener('click', async (event) => {
              event.stopPropagation();
              await app.deleteGroup(group.id);
            });
            head.appendChild(removeGroup);
          }
        }

        card.addEventListener('click', async () => {
          await app.focusGroup(group.id);
          renderSidebar();
        });
        container.appendChild(card);
      }
      if (state.activeGroupId !== lastRenderedActiveGroupId) {
        lastRenderedActiveGroupId = state.activeGroupId;
        requestAnimationFrame(() => {
          container.querySelector(`[data-group-id="${CSS.escape(state.activeGroupId)}"]`)?.scrollIntoView({ block: 'nearest' });
        });
      }

      // Only push the server value into the textarea when the server value
      // actually changed (undo, reload, another writer). Rewriting it on every
      // render threw away whatever the user had typed but not yet blurred.
      const serverGlobalNote = state.globalNote ?? '';
      if (serverGlobalNote !== lastRenderedGlobalNote) {
        el('global-note').value = serverGlobalNote;
        lastRenderedGlobalNote = serverGlobalNote;
      }
      restoreNoteFocus(noteFocus);
      el('undo-button').disabled = mutationPending || !state.canUndo;
      el('redo-button').disabled = mutationPending || !state.canRedo;
      el('submit-button').disabled = mutationPending || !state.canSubmit;
    }

    window.addEventListener('resize', resizeCanvas);

    // Submitting used to leave the annotation tab sitting open with only a
    // small sidebar-footer line of text as feedback — easy to miss, and the
    // tab itself never told the user (or the agent watching the target
    // page) that the task was actually done. This makes success loud
    // — a modal confirmation with the real task id — and then closes
    // the tab automatically so the user lands back on the page they were
    // annotating instead of a dead annotation UI.
    function showSubmitOverlayAndClose(taskId) {
      el('submit-overlay-taskid').textContent = taskId;
      el('submit-overlay').hidden = false;
      setTimeout(() => {
        window.close();
        // window.close() is a no-op for tabs not opened by script in some
        // browsers/policies; if we're still here after a beat, fall back to
        // leaving the overlay up rather than silently doing nothing forever.
      }, 1600);
    }

    applyLocale();
    if (img.complete) {
      boot();
    } else {
      img.addEventListener('load', boot);
    }
  </script>
</body>
</html>
